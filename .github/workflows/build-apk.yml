name: Build LiquidDock APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleRelease -x lint -x test -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Locate & Package APK
        run: |
          mkdir -p output_apk
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            SRC_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          else
            SRC_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          fi
          
          FINAL_APK="output_apk/LiquidDock-v1.0.0.apk"
          cp "$SRC_APK" "$FINAL_APK"
          echo "APK_PATH=$FINAL_APK" >> $GITHUB_ENV
          echo "Built APK located at: $FINAL_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidDock-v1.0.0-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-${{ github.run_number }}"
          TITLE="LiquidDock Sandbox v1.0.0 (Build ${{ github.run_number }})"
          NOTES="### 📱 Liquid Glass Dockbar Sandbox APK
          
          Experiment and test the **Liquid Glass Dockbar** directly on your Android phone!
          
          - **Toggleable Kyant Liquid Glass** vs Solid Material 3 SurfaceContainer
          - Real-time sliders: blur radius, lens refraction, edge highlights, corner morphs
          - Rich test backdrops: Animated mesh gradients, album art grids, neon glows
          - Commit: \`${{ github.sha }}\`"
          
          gh release create "$TAG" "${{ env.APK_PATH }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease=false || true
